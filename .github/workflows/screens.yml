# The demo on a real Windows and a real Linux, with a screenshot of each screen taken through the system -- the proof
# that the glass draws there, not only on the Mac it was made on. Started by hand only (Actions > screens > Run).
name: screens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # Windows Server 2025 is built on Windows 11 24H2 (build 26100): Acrylic is drawn there.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Transparency effects on, as a person's Windows has them
        shell: pwsh
        run: |
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name EnableTransparency -Value 1 -Type DWord
      - name: What Windows has for drawing glass here
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterCompatibility | Format-List
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' | Select-Object EnableTransparency | Format-List
          query session 2>$null
          "Session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"
          exit 0
      - name: A screen big enough for the whole demo
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      # Each run checks every piece in the page (demo/checks.mjs) and fails on any miss.
      - name: The demo on Acrylic, over a colourful window, checked and taken through the system
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          npx electron demo/main.mjs --screenshot shots/windows.png
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npx electron demo/main.mjs --screenshot shots/windows-frameless.png --frameless
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The sample, Rainbow painted under the page, checked and cropped to the window
        shell: pwsh
        run: |
          npx electron demo/main.mjs --screenshot shots/windows-sample.png --crop --rainbow
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The README's own app, installing the package as an app does, with the same checks loaded ahead of its code.
      - name: The README's app (examples/plain), checked
        shell: pwsh
        working-directory: examples/plain
        run: |
          npm install --no-audit --no-fund
          # Electron 44 downloads its binary the first time it is asked for, saying so on the way: fetch it first.
          npx electron --version
          $electron = node -p "require('electron')"
          $env:NODE_OPTIONS = '--import=../../test/example-check.mjs'
          & $electron . | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: shots/

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: The demo with the page's own glass, checked and taken through the system
        run: |
          mkdir -p shots
          xvfb-run -a -s "-screen 0 1440x900x24" npx electron demo/main.mjs --screenshot shots/linux.png --no-sandbox
      - name: The README's app (examples/plain), checked
        working-directory: examples/plain
        run: |
          npm install --no-audit --no-fund
          npx electron --version
          NODE_OPTIONS=--import=../../test/example-check.mjs xvfb-run -a "$(node -p "require('electron')")" . --no-sandbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux
          path: shots/
